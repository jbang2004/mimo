name: Capture public MiMo dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - capture.py
      - .github/workflows/capture.yml

permissions:
  contents: write

concurrency:
  group: mimo-public-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Capture only public dashboard evidence
        run: python capture.py
      - name: Save capture result without changing analysis
        shell: bash
        run: |
          set -euo pipefail
          test -s source-capture.json
          cp source-capture.json "$RUNNER_TEMP/mimo-source-capture.json"
          git config user.name 'mimo-observatory[bot]'
          git config user.email 'mimo-observatory@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/mimo-source-capture.json" source-capture.json
            git add source-capture.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record public MiMo dashboard capture'
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo 'Could not save capture after concurrent changes.' >&2
          exit 1
